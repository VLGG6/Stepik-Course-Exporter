[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stepik-course-exporter"
version = "0.1.0"
description = "Экспорт курсов Stepik в локальные Markdown/JSON"
authors = [
    {name = "Stepik Course Exporter Team"},
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.28.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/example/stepik-course-exporter"

[tool.setuptools]
py-modules = ["app"]

[project.scripts]
stepik-exporter = "app:run"